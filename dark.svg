    <text x="0" y="146" fill="#94A3B8" font-size="14" class="mono" font-weight="500">Origin</text>
    <line x1="72.0" y1="142" x2="628.5" y2="142" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="686" y="146" text-anchor="end" fill="#F8FAFC" font-size="14" class="mono" font-weight="600" textLength="46.0" lengthAdjust="spacingAndGlyphs">India</text>
